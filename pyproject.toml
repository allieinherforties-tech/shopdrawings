[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shop-drawings"
version = "0.1.0"
description = "Typed furniture specification schema for the Shop Drawings design-to-fabrication pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shop_drawings"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
