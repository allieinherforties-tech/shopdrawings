[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shop-drawings"
version = "0.1.0"
description = "Design-to-fabrication pipeline: typed spec schema, PDF extraction, validation, review gate, and deterministic .3dm/DXF/cut-list generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pdfplumber>=0.11",
    "pypdfium2>=4",
    "pillow>=10",
    "rhino3dm>=8.35,<9",
    "ezdxf>=1.4,<2",
]

[project.optional-dependencies]
# The vision path is optional: text-layer PDFs extract fully without it.
vision = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "reportlab>=4",
    "anthropic>=0.40",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shop_drawings"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Deliberate typography: the multiplication sign in dimension strings
# ("length × width") and en/em dashes in prose and review questions.
allowed-confusables = ["×", "–", "—"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.11"

[[tool.mypy.overrides]]
# PDF/image libraries ship without type stubs; the extraction modules wrap
# them at the edges, so the untyped boundary is contained to ingest.py.
module = ["pdfplumber.*", "pypdfium2.*", "PIL.*", "reportlab.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
