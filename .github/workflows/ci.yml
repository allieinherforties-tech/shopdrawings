name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type-check
        run: mypy src tests
      - name: Test
        run: pytest
      - name: End-to-end proof
        run: python scripts/e2e_proof.py
      - name: Golden files (verify mode)
        run: pytest tests/golden/test_golden_files.py -q --strict-markers
        env:
          # Verify mode is the default; make the contract explicit.
          SHOP_DRAWINGS_REGEN_GOLDEN: ""
